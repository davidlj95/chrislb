name: Style
on:
  workflow_call:

jobs:
  build:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Format check
        run: pnpm run format:check:all
